<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="engBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080a0f"/>
      <stop offset="100%" stop-color="#121622"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#engBg)" rx="16"/>

  <!-- Top bar -->
  <rect x="30" y="30" width="740" height="50" rx="10" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <circle cx="56" cy="55" r="5" fill="#ff5f56"/>
  <circle cx="74" cy="55" r="5" fill="#ffbd2e"/>
  <circle cx="92" cy="55" r="5" fill="#27c93f"/>

  <text x="120" y="59" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="700">AUTONOMOUS REPORT GENERATION SYSTEM</text>
  <text x="500" y="59" fill="rgba(255,255,255,0.4)" font-family="monospace" font-size="11">NODE.JS • POSTGRES • LLM</text>

  <!-- Flow Steps -->
  <g transform="translate(50, 110)">
    <!-- Step 1 -->
    <rect width="150" height="150" rx="12" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.1)"/>
    <text x="16" y="32" fill="#d4ff00" font-family="monospace" font-size="11" font-weight="700">01 / TRIGGER</text>
    <text x="16" y="60" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-size="15" font-weight="700">Cron &amp; Event</text>
    <text x="16" y="85" fill="rgba(255,255,255,0.6)" font-family="sans-serif" font-size="11">Daily 00:00 UTC</text>
    <text x="16" y="105" fill="rgba(255,255,255,0.6)" font-family="sans-serif" font-size="11">Webhook event</text>
    <text x="16" y="130" fill="#38bdf8" font-family="monospace" font-size="10">status: armed</text>

    <!-- Arrow -->
    <line x1="165" y1="75" x2="195" y2="75" stroke="#d4ff00" stroke-width="2"/>
    <polygon points="193,71 201,75 193,79" fill="#d4ff00"/>

    <!-- Step 2 -->
    <g transform="translate(210, 0)">
      <rect width="150" height="150" rx="12" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.1)"/>
      <text x="16" y="32" fill="#d4ff00" font-family="monospace" font-size="11" font-weight="700">02 / QUERY</text>
      <text x="16" y="60" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-size="15" font-weight="700">SQL Engine</text>
      <text x="16" y="85" fill="rgba(255,255,255,0.6)" font-family="sans-serif" font-size="11">Supabase DB</text>
      <text x="16" y="105" fill="rgba(255,255,255,0.6)" font-family="sans-serif" font-size="11">Aggregated metrics</text>
      <text x="16" y="130" fill="#38bdf8" font-family="monospace" font-size="10">rows: 42,910</text>
    </g>

    <!-- Arrow -->
    <line x1="375" y1="75" x2="405" y2="75" stroke="#d4ff00" stroke-width="2"/>
    <polygon points="403,71 411,75 403,79" fill="#d4ff00"/>

    <!-- Step 3 -->
    <g transform="translate(420, 0)">
      <rect width="150" height="150" rx="12" fill="rgba(212,255,0,0.06)" stroke="#d4ff00" stroke-width="1.5"/>
      <text x="16" y="32" fill="#d4ff00" font-family="monospace" font-size="11" font-weight="700">03 / SYNTHESIS</text>
      <text x="16" y="60" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-size="15" font-weight="700">LLM Analysis</text>
      <text x="16" y="85" fill="rgba(255,255,255,0.7)" font-family="sans-serif" font-size="11">Executive Summary</text>
      <text x="16" y="105" fill="rgba(255,255,255,0.7)" font-family="sans-serif" font-size="11">Risk Anomalies</text>
      <text x="16" y="130" fill="#4ade80" font-family="monospace" font-size="10">tokens: 3,420</text>
    </g>

    <!-- Arrow -->
    <line x1="585" y1="75" x2="615" y2="75" stroke="#d4ff00" stroke-width="2"/>
    <polygon points="613,71 621,75 613,79" fill="#d4ff00"/>

    <!-- Step 4 -->
    <g transform="translate(630, 0)">
      <rect width="150" height="150" rx="12" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.1)"/>
      <text x="16" y="32" fill="#d4ff00" font-family="monospace" font-size="11" font-weight="700">04 / EXPORT</text>
      <text x="16" y="60" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-size="15" font-weight="700">PDF Storage</text>
      <text x="16" y="85" fill="rgba(255,255,255,0.6)" font-family="sans-serif" font-size="11">CDN Signed URL</text>
      <text x="16" y="105" fill="rgba(255,255,255,0.6)" font-family="sans-serif" font-size="11">Client Email Delivery</text>
      <text x="16" y="130" fill="#4ade80" font-family="monospace" font-size="10">delivered 100%</text>
    </g>
  </g>

  <!-- Output preview console -->
  <g transform="translate(50, 285)">
    <rect width="700" height="155" rx="10" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.08)"/>
    <text x="20" y="30" fill="rgba(255,255,255,0.4)" font-family="sans-serif" font-size="10" font-weight="700">AUTOMATED PIPELINE LOG ARCHIVE</text>
    <g transform="translate(20, 50)" font-family="monospace" font-size="12">
      <text x="0" y="16" fill="#a0a0a0"><tspan fill="#d4ff00">[2024-11-02 00:00:01]</tspan> Worker started: processing daily audit cluster for 14 active client accounts</text>
      <text x="0" y="40" fill="#a0a0a0"><tspan fill="#d4ff00">[2024-11-02 00:00:04]</tspan> SQL aggregations completed. 0 anomalies detected in schema validation</text>
      <text x="0" y="64" fill="#a0a0a0"><tspan fill="#d4ff00">[2024-11-02 00:00:09]</tspan> LLM synthesis generated executive summary &amp; risk matrix</text>
      <text x="0" y="88" fill="#ffffff" font-weight="bold"><tspan fill="#4ade80">[COMPLETED]</tspan> Reports dispatched to storage bucket: report_batch_20241102.pdf (2.4MB)</text>
    </g>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="dashBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0b10"/>
      <stop offset="100%" stop-color="#12151e"/>
    </linearGradient>
    <linearGradient id="barGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="rgba(212,255,0,0.2)"/>
      <stop offset="100%" stop-color="#d4ff00"/>
    </linearGradient>
    <linearGradient id="chartGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d4ff00"/>
      <stop offset="50%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#dashBg)" rx="16"/>

  <!-- Top Navigation Bar -->
  <rect x="30" y="30" width="740" height="50" rx="10" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <circle cx="56" cy="55" r="5" fill="#ff5f56"/>
  <circle cx="74" cy="55" r="5" fill="#ffbd2e"/>
  <circle cx="92" cy="55" r="5" fill="#27c93f"/>

  <text x="120" y="59" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="700">AI RISK REPORT DASHBOARD</text>
  <text x="350" y="59" fill="rgba(255,255,255,0.4)" font-family="monospace" font-size="11">GSAP • HTML5 CANVAS • REACT</text>

  <!-- Status -->
  <rect x="660" y="43" width="94" height="24" rx="6" fill="rgba(212,255,0,0.1)" stroke="#d4ff00" stroke-width="1"/>
  <text x="707" y="59" fill="#d4ff00" font-family="'Space Grotesk', sans-serif" font-size="10" font-weight="700" text-anchor="middle">ACTIVE AUDIT</text>

  <!-- Left Main KPI Card -->
  <g transform="translate(30, 96)">
    <rect width="250" height="374" rx="12" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <text x="24" y="36" fill="rgba(255,255,255,0.4)" font-family="sans-serif" font-size="11" font-weight="600">CONFIDENCE INDEX</text>
    <text x="24" y="90" fill="#d4ff00" font-family="'Space Grotesk', sans-serif" font-size="52" font-weight="800">98.6<tspan font-size="28">%</tspan></text>
    
    <!-- Circular Radial Gauge -->
    <circle cx="125" cy="190" r="64" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="12"/>
    <circle cx="125" cy="190" r="64" fill="none" stroke="#d4ff00" stroke-width="12" stroke-dasharray="402" stroke-dashoffset="40" stroke-linecap="round"/>
    <text x="125" y="196" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-size="20" font-weight="700" text-anchor="middle">A+ TIER</text>

    <!-- Sub metrics -->
    <g transform="translate(24, 280)" font-family="sans-serif" font-size="12">
      <text x="0" y="18" fill="rgba(255,255,255,0.6)">Novelty Score:</text>
      <text x="190" y="18" fill="#ffffff" font-weight="bold" text-anchor="end">94.8 / 100</text>
      <text x="0" y="44" fill="rgba(255,255,255,0.6)">Prior-Art Collision:</text>
      <text x="190" y="44" fill="#38bdf8" font-weight="bold" text-anchor="end">0.03 (Minimal)</text>
      <text x="0" y="70" fill="rgba(255,255,255,0.6)">Vector Distance:</text>
      <text x="190" y="70" fill="#4ade80" font-weight="bold" text-anchor="end">0.89 cosine</text>
    </g>
  </g>

  <!-- Right Canvas Graph Visualization -->
  <g transform="translate(300, 96)">
    <rect width="470" height="230" rx="12" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <text x="24" y="32" fill="rgba(255,255,255,0.6)" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="700">CANVAS WAVE HARMONICS &amp; THREAT MATRIX</text>
    
    <!-- Grid lines -->
    <line x1="24" y1="70" x2="446" y2="70" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
    <line x1="24" y1="120" x2="446" y2="120" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
    <line x1="24" y1="170" x2="446" y2="170" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
    
    <!-- Smooth Spline Path -->
    <path d="M 30 180 Q 80 60, 140 140 T 260 90 T 360 130 T 440 60" fill="none" stroke="url(#chartGlow)" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Glowing Nodes -->
    <circle cx="140" cy="140" r="5" fill="#d4ff00"/>
    <circle cx="260" cy="90" r="5" fill="#4ade80"/>
    <circle cx="360" cy="130" r="5" fill="#38bdf8"/>
    <circle cx="440" cy="60" r="6" fill="#d4ff00"/>
    
    <text x="440" y="44" fill="#d4ff00" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">PEAK 99.2%</text>
  </g>

  <!-- Bottom Mini Cards -->
  <g transform="translate(300, 342)">
    <rect width="225" height="128" rx="10" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <text x="20" y="28" fill="rgba(255,255,255,0.4)" font-family="sans-serif" font-size="10" font-weight="600">AUDIT PROCESSING SPEED</text>
    <text x="20" y="68" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-size="30" font-weight="700">184 <tspan font-size="16" fill="rgba(255,255,255,0.5)">ms</tspan></text>
    <text x="20" y="96" fill="#38bdf8" font-family="sans-serif" font-size="11">⚡ Zero Frame Drops (60 FPS)</text>
  </g>

  <g transform="translate(545, 342)">
    <rect width="225" height="128" rx="10" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <text x="20" y="28" fill="rgba(255,255,255,0.4)" font-family="sans-serif" font-size="10" font-weight="600">DATABASE INTEGRITY</text>
    <text x="20" y="68" fill="#d4ff00" font-family="'Space Grotesk', sans-serif" font-size="30" font-weight="700">SUPABASE</text>
    <text x="20" y="96" fill="#4ade80" font-family="sans-serif" font-size="11">✓ RLS Policy Enforced</text>
  </g>
</svg>

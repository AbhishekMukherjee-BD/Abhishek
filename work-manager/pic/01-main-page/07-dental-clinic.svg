<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="dentBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1016"/>
      <stop offset="100%" stop-color="#121b26"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#dentBg)" rx="16"/>

  <!-- Window Header -->
  <rect x="30" y="30" width="740" height="50" rx="10" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <circle cx="56" cy="55" r="5" fill="#ff5f56"/>
  <circle cx="74" cy="55" r="5" fill="#ffbd2e"/>
  <circle cx="92" cy="55" r="5" fill="#27c93f"/>

  <text x="120" y="59" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="700">DENTAL CLINIC HEALTHCARE PORTAL</text>
  <text x="460" y="59" fill="rgba(255,255,255,0.4)" font-family="monospace" font-size="11">HTML5 • CSS3 • JAVASCRIPT</text>

  <!-- Content Showcase -->
  <g transform="translate(60, 110)">
    <text x="0" y="30" fill="#38bdf8" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="700" letter-spacing="1.5">MODERN DENTAL EXCELLENCE</text>
    <text x="0" y="74" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-size="34" font-weight="800">Advanced Dental Care &amp; Aesthetic Smiles</text>
    <text x="0" y="106" fill="rgba(255,255,255,0.6)" font-family="sans-serif" font-size="14">Conversion-optimized patient booking portal, treatment showcases, and verified patient reviews.</text>

    <!-- 3 Service Feature Cards -->
    <g transform="translate(0, 140)">
      <rect width="210" height="150" rx="12" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)"/>
      <text x="20" y="36" fill="#38bdf8" font-size="20">✦</text>
      <text x="20" y="68" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-size="16" font-weight="700">Cosmetic Dentistry</text>
      <text x="20" y="96" fill="rgba(255,255,255,0.5)" font-family="sans-serif" font-size="11">Porcelain veneers, Invisalign aligners, and laser teeth whitening.</text>
      <text x="20" y="130" fill="#38bdf8" font-family="sans-serif" font-size="11" font-weight="600">Learn More →</text>
    </g>

    <g transform="translate(235, 140)">
      <rect width="210" height="150" rx="12" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)"/>
      <text x="20" y="36" fill="#38bdf8" font-size="20">◈</text>
      <text x="20" y="68" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-size="16" font-weight="700">Dental Implants</text>
      <text x="20" y="96" fill="rgba(255,255,255,0.5)" font-family="sans-serif" font-size="11">Titanium implants with 3D digital imaging precision and same-day crowns.</text>
      <text x="20" y="130" fill="#38bdf8" font-family="sans-serif" font-size="11" font-weight="600">Learn More →</text>
    </g>

    <g transform="translate(470, 140)">
      <rect width="210" height="150" rx="12" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)"/>
      <text x="20" y="36" fill="#38bdf8" font-size="20">◎</text>
      <text x="20" y="68" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-size="16" font-weight="700">Patient Reviews</text>
      <text x="20" y="96" fill="#facc15" font-family="sans-serif" font-size="14">★★★★★</text>
      <text x="20" y="118" fill="rgba(255,255,255,0.7)" font-family="sans-serif" font-size="11">4.9 / 5.0 (310+ ratings)</text>
      <text x="20" y="136" fill="#4ade80" font-family="monospace" font-size="10">Verified on Google</text>
    </g>
  </g>
</svg>

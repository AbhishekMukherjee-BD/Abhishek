<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="chatBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0e14"/>
      <stop offset="100%" stop-color="#141824"/>
    </linearGradient>
    <linearGradient id="aiBubble" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(212,255,0,0.14)"/>
      <stop offset="100%" stop-color="rgba(212,255,0,0.04)"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#chatBg)" rx="16"/>

  <!-- Window Header -->
  <rect x="30" y="30" width="740" height="440" rx="12" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
  <rect x="30" y="30" width="740" height="54" rx="12" fill="rgba(255,255,255,0.03)"/>

  <circle cx="56" cy="57" r="5" fill="#ff5f56"/>
  <circle cx="74" cy="57" r="5" fill="#ffbd2e"/>
  <circle cx="92" cy="57" r="5" fill="#27c93f"/>

  <text x="120" y="61" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="700">AI CONVERSATIONAL AGENT &amp; BOOKING ENGINE</text>
  
  <rect x="635" y="45" width="120" height="24" rx="12" fill="rgba(212,255,0,0.1)" stroke="#d4ff00" stroke-width="1"/>
  <circle cx="647" cy="57" r="3.5" fill="#d4ff00"/>
  <text x="656" y="61" fill="#d4ff00" font-family="sans-serif" font-size="10" font-weight="700">AUTONOMOUS</text>

  <!-- Left Chat Stream -->
  <g transform="translate(60, 110)">
    <!-- User Message 1 -->
    <rect x="240" y="0" width="440" height="44" rx="16" fill="rgba(255,255,255,0.08)"/>
    <text x="260" y="27" fill="#ffffff" font-family="sans-serif" font-size="13">"Hi, I need to schedule an urgent consultation with Dr. Skinner for tomorrow afternoon."</text>
    
    <!-- AI Agent Response 1 -->
    <rect x="0" y="60" width="480" height="72" rx="16" fill="url(#aiBubble)" stroke="#d4ff00" stroke-width="1"/>
    <text x="20" y="86" fill="#d4ff00" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="700">✦ CLINIC AGENT (OPENROUTER / LLM)</text>
    <text x="20" y="112" fill="#ffffff" font-family="sans-serif" font-size="13">Dr. David Skinner has an opening at 2:30 PM and 4:00 PM tomorrow. Shall I lock in 2:30 PM for you?</text>

    <!-- User Message 2 -->
    <rect x="420" y="150" width="260" height="42" rx="16" fill="rgba(255,255,255,0.08)"/>
    <text x="440" y="176" fill="#ffffff" font-family="sans-serif" font-size="13">"Yes, 2:30 PM works perfectly!"</text>

    <!-- AI Agent Confirmation with Action Badge -->
    <rect x="0" y="210" width="530" height="120" rx="16" fill="url(#aiBubble)" stroke="#d4ff00" stroke-width="1"/>
    <text x="20" y="236" fill="#d4ff00" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="700">✦ N8N DISPATCH ENGINE • WEBHOOK EXECUTED</text>
    <text x="20" y="262" fill="#ffffff" font-family="sans-serif" font-size="13">Confirmed! Appointment reserved for tomorrow at 2:30 PM.</text>
    
    <!-- Action tags -->
    <g transform="translate(20, 280)">
      <rect width="180" height="28" rx="6" fill="rgba(0,0,0,0.4)" stroke="rgba(255,255,255,0.1)"/>
      <text x="14" y="18" fill="#4ade80" font-family="monospace" font-size="11">✓ Calendar Sync: SUCCESS</text>

      <rect x="195" width="165" height="28" rx="6" fill="rgba(0,0,0,0.4)" stroke="rgba(255,255,255,0.1)"/>
      <text x="209" y="18" fill="#38bdf8" font-family="monospace" font-size="11">✓ SMS / Email Dispatched</text>
    </g>
  </g>
</svg>

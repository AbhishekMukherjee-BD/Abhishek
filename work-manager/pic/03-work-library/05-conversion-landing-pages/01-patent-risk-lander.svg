<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0b0e"/>
      <stop offset="100%" stop-color="#141720"/>
    </linearGradient>
    <linearGradient id="limeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d4ff00"/>
      <stop offset="100%" stop-color="#a8d600"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.06)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.02)"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bgGrad)" rx="16"/>

  <!-- Subtle Grid Pattern -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="160" y1="0" x2="160" y2="500"/>
    <line x1="320" y1="0" x2="320" y2="500"/>
    <line x1="480" y1="0" x2="480" y2="500"/>
    <line x1="640" y1="0" x2="640" y2="500"/>
  </g>

  <!-- Window Header -->
  <rect x="30" y="30" width="740" height="440" rx="12" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
  <rect x="30" y="30" width="740" height="48" rx="12" fill="rgba(255,255,255,0.04)"/>
  
  <!-- Window Dots -->
  <circle cx="56" cy="54" r="5" fill="#ff5f56"/>
  <circle cx="74" cy="54" r="5" fill="#ffbd2e"/>
  <circle cx="92" cy="54" r="5" fill="#27c93f"/>

  <!-- Window Title -->
  <text x="400" y="58" fill="rgba(255,255,255,0.6)" font-family="'Space Grotesk', -apple-system, sans-serif" font-size="12" font-weight="600" text-anchor="middle" letter-spacing="2">
    PATENT RISK ANALYSIS SAAS • AUTONOMOUS PIPELINE
  </text>

  <!-- Status Pill -->
  <g transform="translate(640, 42)">
    <rect width="112" height="24" rx="12" fill="rgba(212,255,0,0.12)" stroke="#d4ff00" stroke-width="1"/>
    <circle cx="14" cy="12" r="3.5" fill="#d4ff00" filter="url(#glow)"/>
    <text x="24" y="16" fill="#d4ff00" font-family="'Space Grotesk', sans-serif" font-size="9" font-weight="700" letter-spacing="1">LIVE PIPELINE</text>
  </g>

  <!-- Pipeline Diagram Nodes -->
  <!-- Node 1: Input -->
  <g transform="translate(60, 110)">
    <rect width="180" height="90" rx="10" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.14)" stroke-width="1"/>
    <text x="16" y="32" fill="rgba(255,255,255,0.5)" font-family="monospace" font-size="10">01 / INGESTION</text>
    <text x="16" y="54" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="700">Patent Claims Intake</text>
    <text x="16" y="74" fill="#888888" font-family="sans-serif" font-size="11">PDF &amp; Claim Parser (n8n)</text>
  </g>

  <!-- Arrow 1 -->
  <line x1="240" y1="155" x2="300" y2="155" stroke="#d4ff00" stroke-width="2" stroke-dasharray="4,4"/>
  <polygon points="296,151 306,155 296,159" fill="#d4ff00"/>

  <!-- Node 2: LLM Engine -->
  <g transform="translate(310, 100)">
    <rect width="210" height="110" rx="12" fill="rgba(212,255,0,0.06)" stroke="#d4ff00" stroke-width="1.5"/>
    <text x="20" y="32" fill="#d4ff00" font-family="monospace" font-size="10" font-weight="700">02 / CORE ENGINE</text>
    <text x="20" y="56" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-size="16" font-weight="700">LLM Prompt Engine</text>
    <text x="20" y="78" fill="rgba(255,255,255,0.8)" font-family="sans-serif" font-size="11">Prior-Art Infringement Scan</text>
    <text x="20" y="96" fill="#d4ff00" font-family="monospace" font-size="10">DeepSeek • Claude 3.5 Sonnet</text>
  </g>

  <!-- Arrow 2 -->
  <line x1="520" y1="155" x2="570" y2="155" stroke="#d4ff00" stroke-width="2" stroke-dasharray="4,4"/>
  <polygon points="566,151 576,155 566,159" fill="#d4ff00"/>

  <!-- Node 3: Supabase & Verification -->
  <g transform="translate(580, 110)">
    <rect width="165" height="90" rx="10" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.14)" stroke-width="1"/>
    <text x="16" y="32" fill="rgba(255,255,255,0.5)" font-family="monospace" font-size="10">03 / DATABASE</text>
    <text x="16" y="54" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="700">Supabase Store</text>
    <text x="16" y="74" fill="#888888" font-family="sans-serif" font-size="11">Embeddings &amp; Reports</text>
  </g>

  <!-- Metric Output Cards -->
  <g transform="translate(60, 240)">
    <!-- Metric 1 -->
    <rect width="210" height="190" rx="10" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
    <text x="20" y="36" fill="rgba(255,255,255,0.4)" font-family="sans-serif" font-size="11" font-weight="600">OVERALL RISK SCORE</text>
    <text x="20" y="86" fill="#d4ff00" font-family="'Space Grotesk', sans-serif" font-size="44" font-weight="800">12.4%</text>
    <rect x="20" y="104" width="170" height="6" rx="3" fill="rgba(255,255,255,0.1)"/>
    <rect x="20" y="104" width="22" height="6" rx="3" fill="#d4ff00"/>
    <text x="20" y="136" fill="#88ff88" font-family="sans-serif" font-size="12" font-weight="600">✓ Low Infringement Risk</text>
    <text x="20" y="156" fill="rgba(255,255,255,0.5)" font-family="sans-serif" font-size="10">Verified across 1.4M patents</text>
  </g>

  <!-- Metric 2: Audit Logs -->
  <g transform="translate(290, 240)">
    <rect width="455" height="190" rx="10" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
    <text x="20" y="34" fill="rgba(255,255,255,0.4)" font-family="sans-serif" font-size="11" font-weight="600">LIVE WORKFLOW EXECUTION STREAM</text>
    
    <g transform="translate(20, 52)" font-family="monospace" font-size="11">
      <text x="0" y="14" fill="#a0a0a0"><tspan fill="#d4ff00">[SUCCESS]</tspan> Token validated: amitguddu2505@gmail.com</text>
      <text x="0" y="38" fill="#a0a0a0"><tspan fill="#d4ff00">[SUCCESS]</tspan> PDF OCR completed (28 claims parsed in 340ms)</text>
      <text x="0" y="62" fill="#a0a0a0"><tspan fill="#d4ff00">[SUCCESS]</tspan> Vector search against USPTO &amp; EPO indexed</text>
      <text x="0" y="86" fill="#a0a0a0"><tspan fill="#d4ff00">[SUCCESS]</tspan> Supabase 'reports' record #rep_9024 committed</text>
      <text x="0" y="110" fill="#ffffff" font-weight="bold"><tspan fill="#d4ff00">✦ STATUS:</tspan> Audit report dispatched via client webhook</text>
    </g>
  </g>
</svg>
